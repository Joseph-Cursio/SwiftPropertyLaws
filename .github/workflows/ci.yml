name: CI

# Every job runs on a standard GitHub-hosted runner (macos-15), which is
# free because this repository is public. Minutes become billable if the
# repository goes private or a job moves to a larger runner (for example
# macos-15-xlarge).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Each job takes about 4 minutes, cold build included. Without a timeout a
  # hung run holds the runner for GitHub's 6-hour default.
  test-macos:
    name: Test (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Run tests
        run: swift test --disable-experimental-prebuilts

  build-apple:
    name: Build (${{ matrix.platform }})
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            destination: generic/platform=iOS
          - platform: tvOS
            destination: generic/platform=tvOS
          - platform: watchOS
            destination: generic/platform=watchOS
          - platform: visionOS
            destination: generic/platform=visionOS
    steps:
      - uses: actions/checkout@v6
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build PropertyLawKit
        run: |
          xcodebuild build \
            -scheme PropertyLawKit \
            -destination '${{ matrix.destination }}' \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO
      - name: Build PropertyLawMacro
        run: |
          xcodebuild build \
            -scheme PropertyLawMacro \
            -destination '${{ matrix.destination }}' \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO
