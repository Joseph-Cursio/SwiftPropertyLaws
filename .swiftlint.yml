  - Tests

excluded:
  - .build
  - Validation/.build
  - docs
  - Package.swift

# Opt-in rules. Every opt-in rule SwiftLint 0.65 ships is either listed here
# or deliberately left out. A rule is never left out for its violation count
# (the owner's SwiftLint Rule Notes, "SwiftLint Desirable"). The reasons used:
#
# - The owner's SwiftLint Exclusions notes reject it (explicit_acl,
#   no_magic_numbers, type_contents_order, discouraged_default_parameter, …).
#   `sorted_enum_cases` is off because alphabetising cases destroys an
#   ordinal enum's ranking. `discouraged_optional_boolean` and
#   `private_subject` are on here (0 hits): their notes' reasons don't apply.
# - function_default_parameter_at_end: fixing it means moving the leading
#   `for type:` parameter of the public check functions, an API break.
# - Its verdict is harmful here (Never Autofix folder): `empty_count` flags
#   the `isEmpty == (count == 0)` law itself, and its --fix rewrote
#   `count >= 0` to `isEmpty`.
# - It needs a compiler log (the analyzer rules).
opt_in_rules:
  - accessibility_label_for_image
  - accessibility_trait_for_button
  - array_init
  - balanced_xctest_lifecycle
  - closure_body_length
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - comma_inheritance
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
